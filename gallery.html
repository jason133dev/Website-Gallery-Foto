            <!-- nama -->

            <!-- list -->
            <ul class="list bagi">

        <div class="group scroll">

                <div class="column-group"></div>
            </div>
        </div>

        <!-- koleksi -->
        <div class="koleksi scroll">
            <div class="column-koleksi"></div>

            <div class="column-koleksi"></div>

            <div class="column-koleksi"></div>
        </div>

    <!-- script -->
    <script type="module" src="gallery.js"></script>

    <script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js" fetchpriority="high"></script>
    <script type="module" src="lenis.js"></script>
