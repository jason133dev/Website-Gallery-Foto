<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Osis - MPLS</title>
    <link rel="icon" href="Asset/logo osis.webp">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="event-1.css">
    <link rel="preconnect" href="https://lh3.googleusercontent.com">
    <link rel="preconnect" href="https://script.google.com">
</head>

<body>
    <!-- system -->
    <div class="system lightbox-hilang">
        <h1 class="hilang" id="main-text-system"></h1>
        <p class="hilang text-system" id="text-system1"></p>
        <p class="hilang text-system" id="text-system2" style="margin-bottom: .5rem;"></p>
        <button class="hilang" id="system-button">Muat Ulang</button>
    </div>

    <!-- download-defender -->
    <div class="download-defender"></div>

    <!-- lightbox -->
    <div class="lightbox lightbox-hilang">

        <div class="container-gambar-muncul">
            <img src="" class="gambar-muncul">

            <p id="dataset"> <br>
                <span class="date2"></span>
            </p>

            <button class="download download-hilang" data-download ="">
                <img src="Asset/download.svg" id="icon-download">
                <div class="loader"></div>
                <div class="check-mark"></div>
            </button>
        </div>
    </div>

    <!-- event -->
    <div class="event">
        <a href="index.html">
            <div class="home-btn">
                <img class="icon-home" src="Asset/home.png">
            </div>
        </a>

        <h1 class="event-teks">MPLS 2026</h1>
    </div>

    <!-- Arrow -->
    <div class="arrow scroll">
        <img src="Asset/arrow white.png" style="rotate: 270deg;">
    </div>

    <!-- koleksi -->
    <div class="koleksi-container scroll">
        <div class="title2">
            <h1 class="main2">Loading...</h1>
        </div>

        <div class="koleksi">
            <div class="column" id="column-1">
                <div class="skeleton loading-asset"></div>
                <div class="skeleton loading-asset"></div>
                <div class="skeleton loading-asset"></div>
            </div>
            <div class="column" id="column-2">
                <div class="skeleton loading-asset"></div>
                <div class="skeleton loading-asset"></div>
                <div class="skeleton loading-asset"></div>
            </div>
            <div class="column" id="column-3">
                <div class="skeleton loading-asset"></div>
                <div class="skeleton loading-asset"></div>
                <div class="skeleton loading-asset"></div>
            </div>
        </div>
        <div id="sentinel"></div>
    </div>

    <!-- script -->
    <script src="event-1.js"></script>
    <script src="api-event-1.js"></script>

    <!-- smooth scroll -->
    <script type="module" src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>
    <script type="module" src="lenis.js"></script>
</body>

</html>
