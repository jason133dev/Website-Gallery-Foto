<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Osis</title>
    <link rel="icon" href="Asset/logo osis.webp">
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://lh3.googleusercontent.com">
    <link rel="preconnect" href="https://script.google.com">
</head>

<body>
    <!-- download-defender -->
    <div class="download-defender"></div>

    <!-- lightbox -->
    <div class="lightbox lightbox-hilang">

        <div class="container-gambar-muncul">
            <img src="" class="gambar-muncul">

            <p id="dataset"> <br>
                <span class="date2"></span>
            </p>

            <button onclick="" class="download download-hilang">
                <img src="Asset/download.svg" id="icon-download">
                <div class="loader"></div>
                <div class="check-mark"></div>
            </button>
        </div>
    </div>

    <div class="container">
        <!-- navbar -->
        <div class="navbar" fetchpriority="high">
            <!-- logo -->
            <div class="container-logo bagi">
                <img class="logo-osis" id="logo" src="Asset/logo osis.webp">
            </div>

            <!-- nama -->
            <h1 class="bagi sinar" id="nama">Digital <span
                    style="font-family: perfectlynineties-regular-italic; letter-spacing: -0.02em;">Gallery</span></h1>

            <!-- list -->
            <ul class="list bagi">
                <li><a href="#" class="link muncul" id="list1">HOME</a></li>
                <li><a href="#" class="link muncul" id="list2">EVENTS</a></li>
                <li><a href="#" class="link muncul" id="list3">RECENT</a></li>
            </ul>

            <!-- hamburger -->
            <div class="container-hamburger bagi">
                <img class="hbr" id="hamburger" src="Asset/hamburger.png">
            </div>
        </div>

        <!-- sidebar -->
        <div class="sidebar">
            <h1 id="menu"><img class="cls" id="close" src="Asset/close.png">DIGITAL GALLERY</h1>
            <!-- dropdown -->
            <div class="dropdown">
                <a class="dropdown-list" href="#">HOME</a>
                <a class="dropdown-list" href="#">EVENTS</a>
                <a class="dropdown-list" href="#">RECENT</a>
            </div>
        </div>

        <!-- hero -->
        <div class="hero">
            <p class="hilang" id="hero-teks2">Every frame tells a story.</p>

            <h1 class="hilang" id="hero-teks">Find Your <span
                    style="font-family: perfectlynineties-regular-italic; letter-spacing: -0.02em;">Moment</span></h1>

            <button class="hilang" id="hero-button">See Collection</button>
        </div>

        <!-- group -->
        <div class="group-container scroll">
            <div class="title">
                <h1 class="main">Events</h1>
                <p class="npc">Show All</p>
            </div>

            <div class="group scroll">
                <div class="column-group-container">

                    <a class="event-1" href="event-1.html">
                        <div class="column-group">
                            <div class="card-img-container">
                                <img src="https://picsum.photos/300/260" class="card-img">
                            </div>
                            <div class="information">
                                <h2 style="font-family: montserrat-bold;">MPLS 2026</h2>
                                <p>Ahmad Yani Binjai</p>
                                <p>12 - 15 Mei 2026</p>
                                <div class="in">
                                    <img src="Asset/in.png">
                                </div>
                            </div>
                        </div>
                    </a>
                </div>
            </div>
        </div>

        <!-- koleksi -->
        <div class="koleksi-container scroll">
            <div class="title2">
                <h1 class="main2">Recent</h1>
                <div class="filter">
                    <img src="Asset/filter.webp" class="filter-logo">
                    <p class="npc2">Filter</p>
                </div>
            </div>

            <div class="filter-tag">
                <button class="filter-tag-button">Best</button>
                <button class="filter-tag-button">Best</button>
                <button class="filter-tag-button">Best</button>
                <button class="filter-tag-button">Best</button>
                <button class="filter-tag-button">Best</button>
            </div>

            <div class="koleksi">
                <div class="column" id="column-1">
                    <div class="skeleton loading-asset"></div>
                    <div class="skeleton loading-asset"></div>
                    <div class="skeleton loading-asset"></div>
                </div>
                <div class="column" id="column-2">
                    <div class="skeleton loading-asset"></div>
                    <div class="skeleton loading-asset"></div>
                    <div class="skeleton loading-asset"></div>
                </div>
                <div class="column" id="column-3">
                    <div class="skeleton loading-asset"></div>
                    <div class="skeleton loading-asset"></div>
                    <div class="skeleton loading-asset"></div>
                </div>
            </div>
            <div id="sentinel"></div>
        </div>
    </div>

    <!-- script -->
    <script src="index.js"></script>
    <script src="api.js"></script>

    <!-- smooth scroll -->
    <script type="module" src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>
    <script type="module" src="lenis.js"></script>
</body>

</html>
